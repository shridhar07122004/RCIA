<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f5f8fc"/><rect width="1200" height="72" fill="#fff" stroke="#dfe6ef"/><rect x="72" y="19" width="34" height="34" rx="9" fill="#1d5dbf"/><text x="89" y="41" fill="white" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">RC</text><text x="118" y="37" fill="#172033" font-family="Arial" font-size="16" font-weight="bold">RCIA</text><text x="118" y="51" fill="#7f8b9f" font-family="Arial" font-size="11">Requirement Change Impact Analyzer</text>
  <text x="72" y="128" fill="#1d5dbf" font-family="monospace" font-size="11" font-weight="bold">02 / REVIEW &amp; PROPOSE</text><text x="72" y="176" fill="#172033" font-family="Arial" font-size="40" font-weight="bold">Review the extracted requirements.</text><text x="72" y="207" fill="#7f8b9f" font-family="Arial" font-size="15">Correct extraction, then describe the change you want to assess.</text>
  <rect x="72" y="252" width="620" height="440" rx="14" fill="white" stroke="#dfe6ef"/><text x="102" y="296" fill="#1d5dbf" font-family="monospace" font-size="11" font-weight="bold">EXTRACTED REQUIREMENTS</text><text x="102" y="332" fill="#172033" font-family="Arial" font-size="22" font-weight="bold">Requirements 6</text><rect x="102" y="352" width="560" height="40" rx="8" fill="#fff" stroke="#c8d4e4"/><text x="120" y="377" fill="#7f8b9f" font-family="Arial" font-size="13">Filter by ID, description, or module…</text>
  <g font-family="Arial" font-size="13"><rect x="102" y="410" width="560" height="56" rx="9" fill="#fbfdff" stroke="#dfe6ef"/><text x="120" y="434" fill="#1d5dbf" font-family="monospace" font-size="12" font-weight="bold">FR-01</text><text x="190" y="434" fill="#172033">Users can log in using email and password</text><text x="190" y="452" fill="#7f8b9f" font-size="10">Functional · Authentication</text><text x="625" y="438" fill="#7f8b9f">Edit</text>
  <rect x="102" y="476" width="560" height="56" rx="9" fill="#fbfdff" stroke="#dfe6ef"/><text x="120" y="500" fill="#1d5dbf" font-family="monospace" font-size="12" font-weight="bold">FR-02</text><text x="190" y="500" fill="#172033">The system validates the user's password</text><text x="190" y="518" fill="#7f8b9f" font-size="10">Functional · Authentication</text><text x="625" y="504" fill="#7f8b9f">Edit</text>
  <rect x="102" y="542" width="560" height="56" rx="9" fill="#fbfdff" stroke="#dfe6ef"/><text x="120" y="566" fill="#1d5dbf" font-family="monospace" font-size="12" font-weight="bold">FR-04</text><text x="190" y="566" fill="#172033">The system manages authenticated sessions</text><text x="190" y="584" fill="#7f8b9f" font-size="10">Functional · Authentication</text><text x="625" y="570" fill="#7f8b9f">Edit</text></g>
  <rect x="718" y="252" width="410" height="440" rx="14" fill="white" stroke="#dfe6ef"/><text x="750" y="296" fill="#1d5dbf" font-family="monospace" font-size="11" font-weight="bold">PROPOSED CHANGE</text><text x="750" y="337" fill="#536074" font-family="Arial" font-size="12" font-weight="bold">What kind of change is this?</text><rect x="750" y="350" width="346" height="42" rx="8" fill="#fff" stroke="#c8d4e4"/><text x="766" y="376" fill="#172033" font-family="Arial" font-size="13">Add a new requirement</text><text x="750" y="425" fill="#536074" font-family="Arial" font-size="12" font-weight="bold">Describe the change</text><rect x="750" y="438" width="346" height="120" rx="8" fill="#fff" stroke="#c8d4e4"/><text x="766" y="468" fill="#172033" font-family="Arial" font-size="13">Add OTP verification after password</text><text x="766" y="491" fill="#172033" font-family="Arial" font-size="13">validation during login.</text><rect x="750" y="594" width="346" height="46" rx="8" fill="#1d5dbf"/><text x="923" y="622" fill="white" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Analyze impact →</text>
