  <text x="104" y="471" fill="#172033" font-family="Arial" font-size="24" font-weight="bold">Upload your SRS</text>
  <text x="104" y="497" fill="#7f8b9f" font-family="Arial" font-size="14">We’ll extract requirement statements for review.</text>
