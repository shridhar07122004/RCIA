  <text x="118" y="51" fill="#7f8b9f" font-family="Arial" font-size="11">Requirement Change Impact Analyzer</text>
  <text x="72" y="138" fill="#1d5dbf" font-family="monospace" font-size="11" font-weight="bold">TRACE CHANGE BEFORE IT SHIPS</text>
